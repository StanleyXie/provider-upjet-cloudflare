name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (default: git tag)"
        default: ''
        required: false

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.24'
  DOCKER_BUILDX_VERSION: 'v0.30.1'
  GHCR_IMAGE: ghcr.io/stanleyxie/provider-upjet-cloudflare
  OPENTOFU_VERSION: '1.11.5'
  TERRAFORM_PROVIDER_SOURCE: cloudflare/cloudflare
  TERRAFORM_PROVIDER_VERSION: '5.18.0'
  TERRAFORM_PROVIDER_DOWNLOAD_NAME: terraform-provider-cloudflare
  TERRAFORM_PROVIDER_DOWNLOAD_URL_PREFIX: https://github.com/cloudflare/terraform-provider-cloudflare/releases/download/v5.18.0
  TERRAFORM_NATIVE_PROVIDER_BINARY: terraform-provider-cloudflare_v5.18.0

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve version
        id: version
        run: |
          V="${{ github.event.inputs.version }}"
          echo "version=${V:-${{ github.ref_name }}}" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-24.04
    needs: prepare
    outputs:
      version: ${{ needs.prepare.outputs.version }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: docker/setup-qemu-action@v4
        with: { platforms: all }

      - uses: docker/setup-buildx-action@v4
        with: { version: '${{ env.DOCKER_BUILDX_VERSION }}' }

      - name: Checkout
        uses: actions/checkout@v6
        with: { fetch-depth: 0, submodules: true }

      - uses: actions/setup-go@v6
        with: { go-version: '${{ env.GO_VERSION }}' }

      - name: Cache Go
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            .work/pkg
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - run: make vendor vendor.check

      - name: Install Crossplane CLI
        run: |
          curl -sL "https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh" | sh
          sudo mv crossplane /usr/local/bin/crossplane

      - name: Build images
        run: make -j2 build.all
        env:
          BUILD_ARGS: "--load --cache-from type=gha --cache-to type=gha,mode=max"

      - name: Build xpkg
        run: make xpkg.build

      - name: Upload xpkg
        uses: actions/upload-artifact@v4
        with:
          name: monolith-xpkg
          path: _output/xpkg/
          retention-days: 1

  publish:
    runs-on: ubuntu-24.04
    needs: build
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Crossplane CLI
        run: |
          curl -sL "https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh" | sh
          sudo mv crossplane /usr/local/bin/crossplane

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download xpkg
        uses: actions/download-artifact@v4
        with:
          name: monolith-xpkg
          path: _output/xpkg/

      - name: Push xpkg to GHCR
        run: |
          XPKG_FILES=$(find _output/xpkg/ -name '*.xpkg' | sed 's/^/--package-files /' | tr '\n' ' ')
          crossplane xpkg push ${XPKG_FILES} \
            ${GHCR_IMAGE}:${VERSION}
          echo "Published: ${GHCR_IMAGE}:${VERSION}"

  release:
    runs-on: ubuntu-24.04
    needs: [build, publish]
    if: startsWith(github.ref, 'refs/tags/')
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists"
          else
            gh release create "${VERSION}" \
              --title "${VERSION}" \
              --generate-notes
          fi
